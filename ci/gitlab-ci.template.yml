# ============================================================================
# ci/gitlab-ci.template.yml — Phase 7c GitLab parity (spec §8/7c, §5.5 seam)
#
# The GitLab mirror of the GitHub Action: the SAME headless driver, the SAME
# hermetic core (action/report.py, adapt.py, flaky_history.py, cache_key.py,
# scripts/ci_slash_commands.py — zero platform imports), and the SAME three
# modes, driven by the AITEST_MODE CI variable:
#
#   generate-only     — headless generation via scripts/ci_generate.py, no
#                       test execution; the package is an artifact.
#   generate-and-run  — generate (or restore from cache) -> pytest (referee)
#                       -> evidence JUnit -> report + flaky markers -> MR
#                       note (idempotent, marker-edited) -> artifacts.
#   run-existing      — run a caller-provided package (AITEST_TESTS) through
#                       pytest + evidence; no LLM needed.
#
# Plus the internal slash-command job (/adapt, /ignore) — see below.
#
# HOW TO USE
# ----------
# 1. Copy this file into your repo as `ci/gitlab-ci.template.yml` (or use a
#    `remote:` include from your fork), and add to `.gitlab-ci.yml`:
#
#        include:
#          - local: ci/gitlab-ci.template.yml
#
# 2. Set the variables below. The essentials:
#      - AITEST_STORY_FILE — path to your story markdown in the repo
#        (versioned + reviewable, like the ignore list)
#      - AITEST_URL        — the STAGING URL to generate against
#      - AITEST_GL_TOKEN   — a project CI/CD variable: GitLab PAT with
#        `api` scope (the action posts MR notes with it); mark it Masked
#      - AITEST_LLM_*      — your LLM endpoint (default: openai-local on
#        http://host.docker.internal:8080/v1 — point AITEST_LLM_BASE_URL at
#        your LM Studio / llama.cpp instance, or use a cloud provider)
# 3. Protect the `ai-testgen-prod` environment if you use the danger zone.
#
# SECURITY (spec §9)
# ------------------
# - The danger zone is guarded by GitLab's protected-environment approval
#   gate: set AITEST_ENV_SUFFIX=prod (and AITEST_DANGER_ZONE=true) and
#   protect the `ai-testgen-prod` environment (Settings -> CI/CD ->
#   Environments) — the pipeline then requires a human approver before the
#   runner starts. The allow-list (localhost / *.staging.* / *-dev /
#   *.test.*) still applies first; danger-zone is for read-only prod smoke
#   tests.
# - MR pipelines from FORKS run with the fork's own variables (no upstream
#   secrets) — the same property that makes GitHub fork-PR exclusion safe.
#   The template's workflow rules deliberately exclude MRs from forks if
#   AITEST_FORK_SAFE is left at its default (see workflow: below).
# - AITEST_GL_TOKEN is a secret: mask it in project settings, never inline
#   it in the repo.
# ============================================================================

variables:
  # --- mode ----------------------------------------------------------------
  AITEST_MODE: "generate-and-run"          # generate-only | generate-and-run | run-existing
  AITEST_TESTS: ""                         # run-existing: path to a generated package (dir or file)
  # --- story / target -------------------------------------------------------
  AITEST_STORY_FILE: "ai-test-story.md"    # story markdown, path relative to the repo root
  AITEST_URL: ""                           # STAGING url only (allow-list enforced)
  # --- LLM -------------------------------------------------------------------
  AITEST_PROVIDER: "openai-local"          # openai-local | lm-studio | ollama | openai
  AITEST_MODEL: ""                         # empty = provider default
  AITEST_LLM_BASE_URL: ""                  # e.g. http://host.docker.internal:8080/v1
  AITEST_LLM_API_KEY: ""                   # cloud providers only
  # --- generation -----------------------------------------------------------
  AITEST_POM: "false"
  AITEST_CREDENTIAL_PROFILE: ""            # {"label","username","password"} for login-gated sites
  AITEST_IGNORE_FILE: ""                   # path to .ai-test-ignore.yml (empty = none; a missing file fails generation)
  AITEST_DANGER_ZONE: "false"              # never true for mutating prod stories
  AITEST_ALLOWED_DOMAINS: ""               # comma-separated extra safe domains
  # --- run -------------------------------------------------------------------
  AITEST_PYTEST_ARGS: "-q --tb=short"
  AITEST_ADAPT: "false"                    # repo-level verified-adaptation opt-in (shared envs)
  AITEST_LEARN: "false"                    # learn: true — persist passing-run flows into the
                                            # branch-cached flow-memory store (flow memory only;
                                            # RAG stays off in CI — the ~80 MB embedder per runner)
  # --- cache / artifacts -----------------------------------------------------
  AITEST_CACHE: "true"
  AITEST_WORKSPACE: "ai-test-workspace"
  AITEST_CACHE_DIR: "$AITEST_WORKSPACE/cache"
  AITEST_RUN_KEY: ""                       # set to "$CI_PIPELINE_ID" for a deterministic cache miss (self-test)
  # --- platform / env gates --------------------------------------------------
  AITEST_ENV_SUFFIX: "staging"             # "prod" + protect the environment -> approval gate
  AITEST_COMMENT: "true"
  AITEST_SKIP_BUILD: "false"               # "true" once the image is pushed (repeat runs)
  AITEST_FORK_SAFE: "false"                # "true" to also run MR pipelines from forks
  AITEST_SELF_TEST: "false"                # INTERNAL: boot the hermetic mock site + fake LLM inside the
                                            # job container (used by the real-project self-test; consumers
                                            # target their own staging URL instead)
  # --- image -----------------------------------------------------------------
  # The action image is built by ai-testgen:build-image and pushed to the
  # project's container registry under this tag.
  AITEST_IMAGE_TAG: "$CI_REGISTRY_IMAGE:ai-test-generator-action-$CI_COMMIT_SHORT_SHA"
  # --- secrets (Settings -> CI/CD -> Variables) ------------------------------
  # AITEST_GL_TOKEN — GitLab PAT with `api` scope (MR note posting). Masked.

workflow:
  rules:
    # MR pipelines (same-repo teams; forks only when AITEST_FORK_SAFE=true —
    # fork MRs run with the fork's own variables, so no upstream secrets leak)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH == $CI_PROJECT_PATH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $AITEST_FORK_SAFE == "true"'
    # default-branch pushes (comment payload only — no MR context)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # manual runs (Run pipeline form) for slash-commands and ad-hoc modes
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # API-created / webhook-triggered pipelines (the documented slash-command
    # trigger path and programmatic runs)
    - if: '$CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger"'
    - when: never

stages:
  - build
  - ai-testgen

# ---------------------------------------------------------------------------
# Build the action image once per commit (the GitHub Action builds it
# implicitly; on GitLab the runner pulls it from the project registry).
# Set AITEST_SKIP_BUILD=true for repeat runs to skip the ~2-5 min build.
# ---------------------------------------------------------------------------
ai-testgen:build-image:
  stage: build
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$AITEST_SKIP_BUILD == "true"'
      when: never
    - when: always
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -f Dockerfile.action -t "$AITEST_IMAGE_TAG" .
    - docker push "$AITEST_IMAGE_TAG"

# ---------------------------------------------------------------------------
# Compute the spec §7 package cache key (sha256(story+url+model+provider+
# PROMPT_FINGERPRINT)) — same module the action uses, so the GitLab cache key
# and the action's internal cache-dir check can never drift. The key is
# exported as a dotenv report; ai-testgen:run reads it in its cache:key.
# (GitLab evaluates cache:key after collecting needs' artifacts, so the
# dotenv variable is available at cache-restore time.)
# ---------------------------------------------------------------------------
ai-testgen:compute-key:
  stage: ai-testgen
  image: python:3.14-slim
  needs: []
  variables:
    GIT_DEPTH: "1"
  script:
    - |
      KEY="$(python3 action/cache_key.py \
        --story "$AITEST_STORY_FILE" \
        --url "$AITEST_URL" \
        --model "$AITEST_MODEL" \
        --provider "$AITEST_PROVIDER")"
      echo "AITEST_CACHE_KEY=$KEY" > ai-testgen-key.env
  artifacts:
    reports:
      dotenv: ai-testgen-key.env
    expire_in: 1 day

# ---------------------------------------------------------------------------
# The three public modes, as two jobs (one is always skipped via rules —
# GitLab's rules: does not accept an `artifacts:` key, so per-mode artifacts
# need separate jobs):
#   ai-testgen:run            — generate-and-run (default) + run-existing
#   ai-testgen:generate-only  — generate-only (package artifact, no junit)
# The shared INPUT_* surface lives in the hidden .ai-testgen:base job and is
# inherited with `extends`. Entrypoint: the action image's /entrypoint.sh
# (image entrypoint neutralised with `entrypoint: [""]` — GitLab runs script
# lines directly, the action is invoked explicitly).
# ---------------------------------------------------------------------------
.ai-testgen:base:
  stage: ai-testgen
  image:
    name: $AITEST_IMAGE_TAG
    entrypoint: [""]
  needs:
    - ai-testgen:build-image
    - ai-testgen:compute-key
  environment:
    name: ai-testgen-$AITEST_ENV_SUFFIX
  cache:
    # CI_COMMIT_REF_NAME = branch for push pipelines, source branch for MR
    # pipelines — the branch scope that lets MR pipelines reuse the push
    # pipeline's package cache (and the slash job reuse the branch snapshot).
    key: ai-testgen-pkg-$CI_COMMIT_REF_NAME-$AITEST_RUN_KEY-$AITEST_CACHE_KEY
    fallback_keys:
      - ai-testgen-pkg-$CI_COMMIT_REF_NAME-
    paths:
      - ai-test-workspace/cache/
      - ai-test-workspace/run-history.json   # per-branch flaky markers (AI-011)
      - ai-test-workspace/evidence/flow_memory.json  # per-branch learned flows (learn: true)
  variables:
    # The action reads INPUT_*; GitLab variable names cannot contain hyphens,
    # so the underscore spellings are set here — the entrypoint's get_input
    # falls back to them when the hyphenated form is absent.
    INPUT_PLATFORM: "gitlab"
    INPUT_MODE: "$AITEST_MODE"
    INPUT_STORY: "$AITEST_STORY_FILE"
    INPUT_URL: "$AITEST_URL"
    INPUT_WORKSPACE: "$AITEST_WORKSPACE"
    INPUT_POM: "$AITEST_POM"
    INPUT_PROVIDER: "$AITEST_PROVIDER"
    INPUT_MODEL: "$AITEST_MODEL"
    INPUT_LLM_BASE_URL: "$AITEST_LLM_BASE_URL"
    INPUT_LLM_API_KEY: "$AITEST_LLM_API_KEY"
    INPUT_CREDENTIAL_PROFILE: "$AITEST_CREDENTIAL_PROFILE"
    INPUT_IGNORE_FILE: "$AITEST_IGNORE_FILE"
    INPUT_DANGER_ZONE: "$AITEST_DANGER_ZONE"
    INPUT_ALLOWED_DOMAINS: "$AITEST_ALLOWED_DOMAINS"
    INPUT_PYTEST_ARGS: "$AITEST_PYTEST_ARGS"
    INPUT_CACHE: "$AITEST_CACHE"
    INPUT_CACHE_DIR: "$AITEST_CACHE_DIR"
    INPUT_COMMENT: "$AITEST_COMMENT"
    INPUT_ADAPT: "$AITEST_ADAPT"
    INPUT_LEARN: "$AITEST_LEARN"
    INPUT_TESTS: "$AITEST_TESTS"
    INPUT_SELF_TEST: "$AITEST_SELF_TEST"
    # MR-note posting (empty on push pipelines -> payload only, like GitHub)
    INPUT_GITLAB_TOKEN: "$AITEST_GL_TOKEN"
    INPUT_GITLAB_PROJECT: "$CI_PROJECT_PATH"
    INPUT_GITLAB_MR_IID: "$CI_MERGE_REQUEST_IID"
    INPUT_GITLAB_API_URL: "$CI_API_V4_URL"
    # The action treats GITHUB_WORKSPACE as the repo root; GitLab's is
    # $CI_PROJECT_DIR.
    GITHUB_WORKSPACE: "$CI_PROJECT_DIR"
  script:
    - /entrypoint.sh

ai-testgen:run:
  extends: .ai-testgen:base
  rules:
    - if: '$AITEST_MODE != "generate-only"'
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      # GitLab's native MR test UI (the raw pytest junit)
      junit: ai-test-workspace/results/junit.xml
    paths:
      - ai-test-workspace/results/junit.xml
      - ai-test-workspace/results/junit-evidence.xml
      - ai-test-workspace/results/report.json
      - ai-test-workspace/results/report.md
      - ai-test-workspace/results/comment.md
      - ai-test-workspace/results/action-state.txt
      - ai-test-workspace/generated_tests/
      - ai-test-workspace/run-history.json

ai-testgen:generate-only:
  extends: .ai-testgen:base
  rules:
    - if: '$AITEST_MODE == "generate-only"'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ai-test-workspace/generated_tests/
      - ai-test-workspace/results/action-state.txt
      - ai-test-workspace/results/report.json
      - ai-test-workspace/results/report.md

# ---------------------------------------------------------------------------
# Slash-command loop (/adapt, /ignore) — GitLab has no issue_comment pipeline
# trigger on free tier, so the job is MANUAL: a human (or a note-event
# webhook hitting the pipeline trigger API) starts it, and it fetches the
# most recent /adapt|/ignore comment on the MR itself via the adapter
# (ci/platform/gitlab.py --latest-command), then posts the reply as an MR
# note. The package comes from the branch's generate-and-run cache.
#
# Manual-first is arguably SAFER than GitHub's auto-trigger: the human
# reviews the failing test before dispatching the command.
# ---------------------------------------------------------------------------
ai-testgen:slash-command:
  stage: ai-testgen
  image:
    name: $AITEST_IMAGE_TAG
    entrypoint: [""]
  needs: []
  when: manual
  # The manual job runs the branch's latest image tag — trigger a pipeline
  # with ai-testgen:build-image first if this job has never run on the branch
  # (the tag embeds CI_COMMIT_SHORT_SHA).
  variables:
    INPUT_PLATFORM: "gitlab"
    INPUT_MODE: "slash-command"
    INPUT_WORKSPACE: "$AITEST_WORKSPACE"
    INPUT_TESTS: "$AITEST_CACHE_DIR/packages"
    INPUT_URL: "$AITEST_URL"
    INPUT_GITLAB_TOKEN: "$AITEST_GL_TOKEN"
    INPUT_GITLAB_PROJECT: "$CI_PROJECT_PATH"
    INPUT_GITLAB_MR_IID: "$CI_MERGE_REQUEST_IID"
    INPUT_GITLAB_API_URL: "$CI_API_V4_URL"
    GITHUB_WORKSPACE: "$CI_PROJECT_DIR"
    AITEST_SLASH_COMMENT: ""               # override: "true" to force a specific command
  cache:
    key: ai-testgen-pkg-$CI_COMMIT_REF_NAME-
    fallback_keys:
      - ai-testgen-pkg-
    paths:
      - ai-test-workspace/cache/
  script:
    - |
      if [ -n "$AITEST_SLASH_COMMENT" ]; then
        export INPUT_COMMENT_BODY="$AITEST_SLASH_COMMENT"
      else
        export INPUT_COMMENT_BODY="$(python ci/platform/gitlab.py --latest-command)"
      fi
      if [ -z "$INPUT_COMMENT_BODY" ]; then
        echo "no /adapt or /ignore comment found on MR !$CI_MERGE_REQUEST_IID — nothing to do"
        exit 0
      fi
      echo "processing: $(echo "$INPUT_COMMENT_BODY" | head -n 1)"
    - /entrypoint.sh
