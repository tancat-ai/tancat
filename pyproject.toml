[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tancat"
version = "0.1.0"
description = "AI-powered Playwright test generator using local LLMs (llama.cpp, Ollama, LM Studio)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    "python-dotenv>=1.1.1",
    "streamlit==1.65.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.14.3",
    "plotly==7.1.0",
    "pandas==3.0.6",
    "pillow>=12.1.1",
    "pyyaml>=6.0.0",
    "pytest-timeout>=2.4.0",
    "cryptography>=49.0.0",
    # RAG: do not bump without reading the keepalive note by the grpcio
    # constraint in [tool.uv]. 3.0.2 stopped the client recovering from the
    # gRPC ping throttle; 3.0.0 restores recovery, so the RPC FAILURES fall to
    # zero (three-site UAT: 6 failed operations before -> 0 after) while the
    # throttle itself is NOT gone - GOAWAYs actually rise (3 -> 4) and the
    # client recovers from them. Two different log strings measure the two:
    #   failure = the gRPC symptom line 'details = "Too many pings"' (spaces) -
    #             the operation raised; counted on that line alone, because an
    #             "_InactiveRpcError" appears twice per failure and also for
    #             unrelated RPC errors (e.g. DEADLINE_EXCEEDED);
    #   GOAWAY  = C-core transport "Received a GOAWAY" / "too_many_pings"
    #             (underscore) - the server throttled, recovery follows.
    # Keep both counts: failed operations must stay 0; a GOAWAY the client
    # cannot recover from is the leading indicator that this pin is broken.
    "pymilvus[milvus-lite]==3.0.0",
    "sentence-transformers==6.1.0",
    "milvus-lite==3.2.1",
    "langgraph>=1.2.9",
    # CPU-only torch. The container has no GPU and the embeddings
    # (sentence-transformers) run on the CPU, but the default Linux wheel drags
    # in ~5GB of CUDA (nvidia-*) machinery per image. The index below serves the
    # CPU build; see [tool.uv.sources] / [[tool.uv.index]] at the end of file.
    "torch",
]

# Console entry point (B-057): without this, `pip install tancat` / `uv tool
# install tancat` gives a package with no runnable command.  `main()` at
# cli.main:main is sync (it wraps asyncio.run(interactive_session())) and
# re-exports the real implementation from src.cli.main, so installing yields a
# working `tancat` interactive CLI.
[project.scripts]
tancat = "cli.main:main"

[project.optional-dependencies]
# Licence-clean PDF reading (owner decision 2026-10-01): pypdfium2 extracts text
# and renders pages (BSD-3-Clause / Apache-2.0); pdfplumber supplies layout and
# table structure (MIT). PyMuPDF was removed - it is AGPL-3.0 or a paid Artifex
# licence, a conflict for an Apache-2.0 product. Licence record:
# docs/licenses/DOCUMENT_READER_LICENSES.md.
pdf = [
    "pypdfium2>=5.13.0",
    "pdfplumber>=0.11.10",
]
# Tier-1 CPU OCR for scanned / image-only PDF pages (AI-055).  The
# ``[ocr]`` extra is optional so the default install stays light and an
# air-gapped customer who doesn't need OCR doesn't pull it.  RapidOCR runs
# on ONNX Runtime = pure CPU, no framework dependency, ~50-80 MB.
ocr = [
    "rapidocr_onnxruntime>=1.3.0",
    # RapidOCR depends on the GUI build opencv-python. The server/headless build
    # provides the same cv2 module without the GUI libraries, at a smaller size.
    # The [tool.uv] override below removes the GUI dependency; this adds headless.
    "opencv-python-headless>=4.10.0",
]
[dependency-groups]
# Published user docs (docs/user/) built with MkDocs Material and deployed to
# GitHub Pages. A separate group, not a project extra, so the docs build and
# deploy can install it alone (`uv sync --only-group docs`) without pulling the
# product's torch/streamlit stack.
docs = [
    "mkdocs-material>=9.6.0",
]
dev = [
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "pre-commit==4.6.2",
    "pandas-stubs>=3.0.0.260204",
    "types-PyYAML>=6.0.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
    "nest-asyncio>=1.6.0",
    "pytest-asyncio>=1.4.0",
    "coverage==7.16.2",
]
[tool.hatch.build.targets.wheel]
packages = ["src", "cli"]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["generated_tests", "scratch", "notebooks", "fixtures", "scripts/debug", "scripts/archive", "scripts/eval/captures", "scripts/eval/captures_graph_final", "scripts/eval/captures_graph_v2", "scripts/eval/captures_linear_final", "scripts/eval/captures_linear_regenerated"]
[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

ignore = ["E501", "B027"]
[tool.ruff.lint.isort]
known-first-party = ["src", "cli"]
[tool.mypy]
python_version = "3.14"
exclude = ["generated_tests", "exported_tests", "scripts", "scratch", "fixtures"]
# `scripts/` is excluded from checking, but tests/ import a few script-local
# helpers via a runtime sys.path insert (eval_runner, eval_metrics,
# golden_validator in scripts/eval/; verify_production in scripts/). Adding the
# dirs to mypy_path resolves those imports statically instead of suppressing
# them — the scripts themselves are still not type-checked.
mypy_path = ["scripts/eval", "scripts"]
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "streamlit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pymilvus.*"
ignore_missing_imports = true

# Optional [ocr] extra — not installed in every environment (CPU ONNX OCR tier).
[[tool.mypy.overrides]]
module = "rapidocr_onnxruntime"
ignore_missing_imports = true

# Licence-clean [pdf] reader - not installed in every environment.
[[tool.mypy.overrides]]
module = "pdfplumber.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pypdfium2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

# RapidOCR requires the GUI build ``opencv-python``. The server variant
# ``opencv-python-headless`` provides the same ``cv2`` module without the GUI
# libraries. The false-marker override drops the GUI requirement; the ``[ocr]``
# extra adds headless in its place (owner direction 2026-10-01).
[tool.uv]
override-dependencies = [
    "opencv-python ; python_version < '0'",
]
# RAG keepalive regression (t-0685; figures corrected t-0693 and t-0698). The
# multi-site/long path logged gRPC "Too many pings" that degraded RAG retrieval
# to no patterns. The tancat-only UAT bisect was 4 runs; pymilvus varied
# (3.0.2 -> 3.0.0), and grpcio (1.83.0 -> 1.84.0) and milvus-lite (3.2.1 ->
# 3.1.1) each changed once. The bisect tracks the FAILED OPERATIONS (the gRPC
# symptom line 'details = "Too many pings"', once per failure), not the
# GOAWAYs: run 1 (pymilvus 3.0.2) = 2 failed operations / 1 GOAWAY; run 3
# (3.0.0) = 0 / 1. 3.0.2 keeps the same keepalive options but reworks the
# channel/reconnect lifecycle, so it no longer recovers from the throttle. The
# three-site UAT agrees: 3.0.2 = 6 failed / 3 GOAWAYs, 3.0.0 = 0 failed /
# 4 GOAWAYs. grpcio is transitive (via pymilvus) and was the original suspect;
# it is pinned to 1.83.0 anyway, though the bisect cleared it. Before the
# Python 3.15 move this pin must be lifted - 1.83.0 has no cp315 wheel, so 3.15
# needs a newer grpcio.
constraint-dependencies = [
    "grpcio==1.83.0",
]

# --- CPU-only PyTorch ------------------------------------------------------
# Without this, torch resolves to the default PyPI Linux wheel, which is the
# CUDA build and pulls in ~5GB of nvidia-* packages. This machine (and the
# container) has no NVIDIA GPU; embeddings are CPU work.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
