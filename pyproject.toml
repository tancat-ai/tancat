[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playwright-test-generator"
version = "0.1.0"
description = "AI-powered Playwright test generator using local LLMs (llama.cpp, Ollama, LM Studio)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai==2.48.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "ollama>=0.1.0",
    "streamlit==1.60.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.14.3",
    "plotly==6.9.0",
    "pandas==3.0.5",
    "pillow>=12.1.1",
    "pyyaml>=6.0.0",
    "pytest-timeout>=2.4.0",
    "cryptography>=49.0.0",
    "pymilvus[milvus-lite]==3.0.0",
    "sentence-transformers==5.6.1",
    "milvus-lite==3.1.1",
    "gitpython==3.1.57",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=1.2.9",
]
pdf = [
    "PyMuPDF>=1.28.0",
]
[dependency-groups]
dev = [
    "ruff==0.16.0",
    "mypy==2.3.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "types-requests>=2.31.0",
    "pre-commit==4.6.1",
    "pandas-stubs>=3.0.0.260204",
    "types-PyYAML>=6.0.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
    "nest-asyncio>=1.6.0",
    "pandas>=2.3.3",
    "pytest-asyncio>=1.4.0",
    "coverage==7.15.2",
]
[tool.hatch.build.targets.wheel]
packages = ["src", "cli"]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["generated_tests", "scratch", "notebooks", "scripts/debug", "scripts/archive", "scripts/eval/captures", "scripts/eval/captures_graph_final", "scripts/eval/captures_graph_v2", "scripts/eval/captures_linear_final", "scripts/eval/captures_linear_regenerated"]
[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

ignore = ["E501", "B027"]
[tool.ruff.lint.isort]
known-first-party = ["src", "cli"]
[tool.mypy]
python_version = "3.14"
exclude = ["generated_tests", "exported_tests", "scripts", "scratch"]
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "streamlit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "generate_3d_map"
ignore_missing_imports = true
disable_error_code = ["assignment", "arg-type", "no-untyped-def"]

[[tool.mypy.overrides]]
module = "pymilvus.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fitz"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true
