<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mock Bank - Sign In</title>
  <link rel="stylesheet" href="style.css" />
  <script src="overlay.js"></script>
</head>
<body>
  <header>
    <span class="brand">Mock Bank</span>
  </header>

  <main>
    <h1 class="title">Welcome to Mock Bank</h1>
    <p class="text-center">Sign in to view your accounts, transfer money, and pay bills.</p>

    <div style="max-width: 380px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; border: 1px solid #eee;">
      <form id="login-form">
        <label for="user-name">Username</label>
        <input type="text" id="user-name" name="username" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />

        <button type="submit" class="btn btn-primary" id="login-button"
          style="margin-top: 16px; width: 100%;">Sign In</button>
      </form>
      <p id="login-error" class="error-message" style="display: none; color: #c0392b; margin-top: 8px;">
        Please enter a username and password.
      </p>
    </div>
  </main>

  <script src="banking.js"></script>
  <script>
    (function () {
      "use strict";
      // Already signed in? Skip the login wall.
      if (MockBank.isSignedIn()) {
        window.location.replace("dashboard.html");
        return;
      }

      var form = document.getElementById("login-form");
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var user = document.getElementById("user-name").value.trim();
        var pass = document.getElementById("password").value;
        if (!user || !pass) {
          document.getElementById("login-error").style.display = "block";
          return;
        }
        // Deterministic demo auth: any non-empty credentials sign in as the
        // demo customer (the mock is a local test target, not a real bank).
        MockBank.signIn(user);
        window.location.href = "dashboard.html";
      });
    })();
  </script>
</body>
</html>
