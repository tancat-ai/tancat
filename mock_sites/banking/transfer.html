<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Transfer Funds - Mock Bank</title>
  <link rel="stylesheet" href="style.css" />
  <script src="overlay.js"></script>
</head>
<body>
  <header>
    <span class="brand">Mock Bank</span>
    <nav>
      <ul>
        <li><a href="/dashboard.html">Accounts</a></li>
        <li class="active"><a href="/transfer.html">Transfer</a></li>
        <li><a href="/payments.html">Pay Bills</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1 class="title">Transfer Money</h1>
    <div style="max-width: 480px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; border: 1px solid #eee;">
      <form id="transfer-form">
        <label for="from-account">From Account</label>
        <select id="from-account" name="from_account" required>
          <option value="checking">Checking Account</option>
          <option value="savings">Savings Account</option>
        </select>

        <label for="to-account">To Account</label>
        <select id="to-account" name="to_account" required>
          <option value="savings">Savings Account</option>
          <option value="checking">Checking Account</option>
        </select>

        <label for="amount">Amount (USD)</label>
        <input type="number" id="amount" name="amount" min="0.01" step="0.01" required />

        <button type="submit" class="btn btn-primary" id="transfer-submit"
          style="margin-top: 16px; width: 100%;">Transfer Funds</button>
      </form>
      <p id="transfer-error" class="error-message" style="display: none; color: #c0392b; margin-top: 8px;">
        Please enter a valid amount.
      </p>
    </div>
  </main>

  <script src="banking.js"></script>
  <script>
    (function () {
      "use strict";
      if (!MockBank.requireSignIn()) {
        return;
      }
      // Pre-select distinct accounts for the demo user.
      var from = document.getElementById("from-account");
      var to = document.getElementById("to-account");
      if (MockBank.accounts().length >= 2) {
        from.value = "checking";
        to.value = "savings";
      }

      document.getElementById("transfer-form").addEventListener("submit", function (event) {
        event.preventDefault();
        var amount = parseFloat(document.getElementById("amount").value);
        if (!amount || amount <= 0) {
          document.getElementById("transfer-error").style.display = "block";
          return;
        }
        MockBank.transfer(
          document.getElementById("from-account").value,
          document.getElementById("to-account").value,
          amount
        );
        window.location.href = "transfer_success.html?amount=" + amount.toFixed(2);
      });
    })();
  </script>
</body>
</html>
