<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Order Confirmed - Mock Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <span class="brand">Mock Store</span>
  </header>

  <main style="text-align: center; padding-top: 60px;">
    <h1 id="order-success-title">Order Confirmed</h1>
    <p id="order-success-message" class="text-center"></p>
    <!--
      AMBIGUOUS MOCK TRAP (the AI-058 measurement target): a VISIBLE element
      whose text semantically overlaps "order success message" ("Your order ...")
      but is NOT the success heading/message. It is a real, visible, high-scoring
      candidate that the resolver can (and historically would) pick instead of
      #order-success-title. A step-scoped learned negative on #order-note must
      demote it so the success element wins. Mirrors the banking #payment-error
      trap, but kept visible so the scraper actually offers it as a candidate.
    -->
    <p id="order-note" class="text-center" style="color: #c0392b; margin-top: 16px;">
      Your order may be subject to a processing delay. Please keep this page open.
    </p>
    <a href="/index.html" class="btn btn-primary" id="back-to-store">Back to Store</a>
  </main>

  <script>
    (function () {
      "use strict";
      var params = new URLSearchParams(window.location.search);
      var item = params.get("item") || "an item";
      var qty = params.get("qty") || "1";
      document.getElementById("order-success-message").textContent =
        "Your order for " + qty + " x " + item + " was placed successfully.";
    })();
  </script>
</body>
</html>
