<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shopping Cart - Mock Store</title>
  <link rel="stylesheet" href="style.css" />
  <script src="overlay.js"></script>
</head>
<body>
  <header>
    <span class="brand">Mock Store</span>
    <nav>
      <ul>
        <li><a href="/index.html">Home</a></li>
        <li><a href="/products.html">Products</a></li>
        <li class="active"><a href="/cart.html">Cart</a></li>
        <li><a href="/checkout.html">Checkout</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1 class="title">Shopping Cart</h1>
    <p id="empty_cart" class="empty-cart" style="display: none;">
      Cart is empty! Please add some products.
    </p>
    <table id="cart_items" class="table">
      <thead>
        <tr>
          <th>Description</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div style="margin-top: 20px; text-align: right;">
      <!-- B-030: the wrapper div (#do_action) must not win over this real
           button — same class as the live site's checkout button. -->
      <a href="/checkout.html" class="btn btn-default check_out">Proceed To Checkout</a>
    </div>
  </main>

  <script src="cart.js"></script>
</body>
</html>
