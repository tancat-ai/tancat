[theme]
base = "dark"
backgroundColor = "#0d0f14"
secondaryBackgroundColor = "#111318"
textColor = "#e2e8f0"
primaryColor = "#4ade80"
font = "monospace"

[server]
# B-071: the file watcher walks *imported modules* (local_sources_watcher) and
# calls hasattr(m, "__path__"), which triggers transformers' lazy vision
# submodules (videomae, vilt, yolos, ...) — each imports torchvision, which is
# not installed → hundreds of ModuleNotFoundError tracebacks per session.
# That noise comes from module introspection, NOT directory scanning, so a
# folderWatchBlacklist cannot stop it (the B-041 comment claiming otherwise
# was wrong). Disabling the watcher removes the spam entirely; the cost is
# auto-rerun on source edits — the app still reruns on every interaction.
# (The blacklist below is kept only so a future watcher re-enable does not
# scan the virtualenv.)
fileWatcherType = "none"
folderWatchBlacklist = [".venv"]
