# pre-commit configuration for ruff
# - ruff: linting and auto-fixes
# - ruff-format: code formatting
# - mypy: type checking
# - eval-accuracy: resolution accuracy gate
#
# To run: pre-commit run
# To install: pre-commit install
#
# Note: generated_tests/, scripts/, scratch/, and fixtures/ are excluded from checks
exclude: ^(generated_tests/|scratch/|notebooks/|fixtures/)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7  # aligned with ruff==0.16.7 in pyproject (CI runs `uv run ruff`)
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        exclude: ^(scripts/|fixtures/)
        additional_dependencies:
          - types-requests

  # Local hooks — run in the project environment
  - repo: local
    hooks:
      - id: eval-accuracy
        name: Eval Accuracy Gate
        description: Blocks commits that drop placeholder resolution accuracy below baseline
        # B-066: --all-extras keeps the hook environment in sync with CI (a bare
        # `uv run` resyncs to the default set and UNINSTALLS the [pdf]/[ocr] extras).
        entry: uv run --all-extras python scripts/eval/eval_harness.py run --mode static --min-accuracy 79 --no-persist
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: kanban-freshness
        name: Kanban Freshness Check
        description: Blocks commits when kanban.html is stale vs BACKLOG.md
        # B-066: --all-extras (same reason as the eval-accuracy hook above).
        entry: uv run --all-extras python scripts/maintenance/kanban.py --check
        language: system
        pass_filenames: false
        always_run: true
