# pre-commit configuration for ruff
# - ruff: linting and auto-fixes
# - ruff-format: code formatting
# - mypy: type checking
# - eval-accuracy: resolution accuracy gate
# - kanban-freshness: kanban.html is current
# - secret-scan: stdlib scan for hardcoded API keys (always runs)
# - gitleaks: fuller secret scan when the gitleaks binary is installed
#
# To run: pre-commit run
# To install: pre-commit install
#
# The exclude below skips generated_tests/, scratch/, notebooks/ and fixtures/.
# It does NOT skip scripts/ - the July key lived in scripts/eval/ - so both
# secret hooks scan scripts/ too.
exclude: ^(generated_tests/|scratch/|notebooks/|fixtures/)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7  # aligned with ruff==0.16.7 in pyproject (CI runs `uv run ruff`)
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        exclude: ^(scripts/|fixtures/)
        additional_dependencies:
          - types-requests

  # Local hooks — run in the project environment
  - repo: local
    hooks:
      - id: eval-accuracy
        name: Eval Accuracy Gate
        description: Blocks commits that drop placeholder resolution accuracy below baseline
        # B-066: --all-extras keeps the hook environment in sync with CI (a bare
        # `uv run` resyncs to the default set and UNINSTALLS the [pdf]/[ocr] extras).
        entry: uv run --all-extras python scripts/eval/eval_harness.py run --mode static --min-accuracy 79 --no-persist
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: kanban-freshness
        name: Kanban Freshness Check
        description: Blocks commits when kanban.html is stale vs BACKLOG.md
        # B-066: --all-extras (same reason as the eval-accuracy hook above).
        entry: uv run --all-extras python scripts/maintenance/kanban.py --check
        language: system
        pass_filenames: false
        always_run: true

      - id: landing-assets-freshness
        name: Landing Assets Freshness
        description: >-
          Blocks a commit that edits a landing source (index.html, tailwind.css,
          the logo, or the install/licence doc) without regenerating the derived
          images and PDF via scripts/maintenance/make_landing_assets.py. The
          share card drifted from the page once; this catches it before push.
        entry: python scripts/maintenance/landing_assets_guard.py --check
        language: system
        pass_filenames: false
        files: ^(landing/|docs/implementation/tancat-pro-install-and-licence\.html|scripts/maintenance/make_landing_assets\.py)

      - id: secret-scan
        name: Secret Scan (block hardcoded API keys)
        description: >-
          Blocks a commit that adds a hardcoded API key or token. Stdlib-only
          script, so it needs no project dependencies and stays fast.
        entry: python scripts/security/secret_scan.py
        language: system
        pass_filenames: true
        always_run: true
        verbose: true

      - id: gitleaks
        name: Gitleaks Secret Scan (when installed)
        description: >-
          Runs gitleaks on the staged commit when the gitleaks binary is on
          PATH. It knows many provider key shapes the stdlib secret-scan does
          not. Skips with a clear message when gitleaks is not installed; the
          CI job runs gitleaks over the history on every push.
        entry: python scripts/security/gitleaks_scan.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
