name: Evaluation Harness

# Manual trigger only — gate (warn), not break
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Evaluation mode"
        required: true
        default: "static"
        type: choice
        options:
          - static
          - full
      min_accuracy:
        description: "Minimum resolution accuracy (%)"
        required: false
        default: "70"
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: Eval Harness (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run eval harness
        shell: bash
        # j-0273: --no-persist is now a static-only flag. A model-bearing mode is a
        # measurement, so it must land in a store; CI writes its throwaway run to
        # its own database and never into the owner's eval_runs.
        run: |
          if [ "${{ inputs.mode }}" = "static" ]; then
            uv run python scripts/eval/eval_harness.py run \
              --mode static \
              --min-accuracy ${{ inputs.min_accuracy }} \
              --no-persist
          else
            uv run python scripts/eval/eval_harness.py run \
              --mode "${{ inputs.mode }}" \
              --min-accuracy ${{ inputs.min_accuracy }} \
              --run-group "ci-${{ github.sha }}" \
              --db ci_eval.sqlite
          fi
        continue-on-error: true

      - name: Generate markdown summary
        # d-0138 follow-up (review F1): a summary must not re-run a leg to report
        # on it. static is offline and cheap, so it still computes; a
        # model-bearing dispatch reads the leg the run step already stored.
        run: |
          if [ "${{ inputs.mode }}" = "static" ]; then
            uv run python scripts/eval/ci_summary.py \
              --mode static \
              --min-accuracy ${{ inputs.min_accuracy }}
          else
            uv run python scripts/eval/ci_summary.py \
              --run-group "ci-${{ github.sha }}" \
              --db ci_eval.sqlite \
              --min-accuracy ${{ inputs.min_accuracy }}
          fi

      - name: Post summary as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('.eval_summary.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Upload eval summary artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-harness-summary
          path: .eval_summary.md
          retention-days: 30
