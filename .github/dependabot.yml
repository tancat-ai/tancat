# Dependabot configuration for tancat-ai/tancat.
#
# Schedule: weekly, Monday. Each update arrives as a pull request to review.
# A known vulnerability in a pinned dependency raises a Dependabot alert on the
# repository (Security tab) in addition to any weekly update PR.
# The durable note lives in SECURITY.md, section "Dependency Management".
#
# Ecosystems in use:
#   - uv              -> pyproject.toml + uv.lock (the Python project)
#   - github-actions  -> .github/workflows/*
# There is no npm ecosystem: the repo has no package.json or JS lockfile.

version: 2
updates:
  # --- Python project (pyproject.toml + uv.lock) ---------------------------
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Deliberate pins - never propose updates for these (the durable note is in
    # SECURITY.md, section "Dependency Management"; the reasons are the RAG
    # keepalive notes in pyproject.toml).
    #   pymilvus  pinned to 3.0.0: 3.0.2 reworks the channel/reconnect lifecycle
    #             and stops the client recovering from the gRPC ping throttle,
    #             which degraded RAG to "Too many pings" GOAWAYs (t-0685).
    #   grpcio    held by the [tool.uv] constraint at 1.83.0 until the Python
    #             3.15 move: 1.83.0 has no cp315 wheel, so 3.15 needs a newer one.
    # Omitting `versions` ignores every version, i.e. all updates.
    ignore:
      - dependency-name: "pymilvus"
      - dependency-name: "grpcio"
    groups:
      # Routine minor and patch bumps arrive as one pull request per week.
      # Major bumps stay ungrouped so each is reviewed on its own - this repo
      # pins some dependencies deliberately (see the RAG notes in pyproject.toml).
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- GitHub Actions ------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
