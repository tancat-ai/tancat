# Phase 7a — GitHub Action metadata.
#
# Docker action: the image is built from action/Dockerfile (uv + Playwright
# chromium, same base as the product image), and action/entrypoint.sh is the
# thin orchestrator over scripts/ci_generate.py + pytest + the AI-028
# evidence exporter. All behaviour lives in this repo (scripts + image) so it
# is testable with pytest, not only via GitHub.
#
# Phase 7a scope: generate-only + run-existing. generate-and-run (PR comment,
# cache, verified adaptation) arrives in 7b — the entrypoint fails fast with
# a clear message instead of silently degrading.

name: 'AI Test Generator'
description: >-
  Generate Playwright Python tests from a user story (headless, hermetic) and
  run them through pytest with JUnit evidence. Modes: generate-only |
  generate-and-run | run-existing. 7b adds the full loop: actions/cache,
  idempotent PR comment, slash-commands (/adapt, /ignore), verified
  adaptation (locator-only, assertion-gated).

inputs:
  mode:
    description: >-
      generate-only (generate a test package, no execution) | generate-and-run
      (generate or restore from cache, run pytest, post the PR comment) |
      run-existing (run a caller-provided package through pytest + JUnit).
      Internal: slash-command (PR-thread /adapt | /ignore loop).
    default: 'generate-only'
  story:
    description: >-
      User story markdown — inline text or a path to a story file in the repo
      (required for generate-only).
    default: ''
  tests:
    description: >-
      Path to an existing generated test package (directory) or test file(s),
      relative to the repo root (required for run-existing).
    default: ''
  url:
    description: >-
      Target site URL — staging only (localhost / *.staging.* / *-dev /
      *.test.*). Override with danger-zone (prod smoke/load testing only).
    default: ''
  workspace:
    description: >-
      AI-029 workspace name; artifacts (generated package, results) are
      written under <repo-root>/<workspace>/ so later steps can upload them.
    default: 'ai-test-workspace'
  pom:
    description: 'Page Object Model mode (generate-only).'
    default: 'false'
  provider:
    description: 'LLM provider: openai-local | lm-studio | ollama | openai.'
    default: 'openai-local'
  model:
    description: 'Model name (defaults to the provider default).'
    default: ''
  llm-base-url:
    description: 'OpenAI-compatible base URL (for local endpoints).'
    default: ''
  llm-api-key:
    description: 'API key for cloud providers — pass from secrets, never inline.'
    default: ''
  credential-profile:
    description: >-
      Login credentials JSON {"label","username","password"} for sites that
      require a session.
    default: ''
  ignore-file:
    description: 'Path to .ai-test-ignore.yml (validated at generation time).'
    default: ''
  danger-zone:
    description: >-
      Explicitly allow a non-allow-listed URL (prod smoke/load testing only).
    default: 'false'
  allowed-domains:
    description: 'Comma-separated extra safe domains (internal staging names).'
    default: ''
  pytest-args:
    description: 'Extra whitespace-separated pytest args for run-existing.'
    default: '-q --tb=short'
  cache:
    description: >-
      Enable actions/cache on generated packages (spec §7). Key =
      sha256(story + url + model + provider + prompt-fingerprint); cache: false
      forces fresh generation every run.
    default: 'true'
  cache-dir:
    description: >-
      Path where the generated-package cache lives (restored by the caller's
      actions/cache step; the action seeds it on miss). Relative to the repo
      root. Default: <workspace>/cache.
    default: ''
  comment:
    description: 'Post the PR summary comment (idempotent, marker-edited).'
    default: 'true'
  adapt:
    description: >-
      Repo-level opt-in for verified adaptation (locator-only patch -> re-run ->
      assertion gate -> keep-or-revert). NEVER default — prefer the /adapt
      slash-command. Requires pull-requests: write to report results.
    default: 'false'
  learn:
    description: >-
      Write patterns from passing runs into the cached flow-memory store
      (generate modes only). NOT IMPLEMENTED — the action fails fast if set to
      true rather than silently no-op'ing.
    default: 'false'
  # Slash-command / internal run context (ci-slash-commands.yml).
  comment-body:
    description: 'INTERNAL: raw PR-thread comment text (slash-command mode).'
    default: ''
  test:
    description: 'INTERNAL: test name for slash-command runs (e.g. test_08_checkout[chromium]).'
    default: ''
  repo:
    description: 'org/repo for comment posting (default: GITHUB_REPOSITORY).'
    default: ''
  pr-number:
    description: 'PR number for comment posting (push runs have none — payload only).'
    default: ''
  github-token:
    description: >-
      Token for comment posting (pass secrets.GITHUB_TOKEN; requires
      pull-requests: write). Omit to write the comment payload without posting.
    default: ''
  # Internal/test-only — never used by consumers.
  self-test:
    description: >-
      INTERNAL: boot the hermetic mock site + fake LLM inside the container
      (used by .github/workflows/ci-cd-action.yml).
    default: 'false'

runs:
  using: 'docker'
  image: 'Dockerfile.action'
  entrypoint: '/entrypoint.sh'
  # Declared so the runner injects GITHUB_OUTPUT into the container (Docker
  # actions only receive it when outputs exist); the stubs additionally read
  # the parallel ai-test-workspace/results/action-state.txt.
  outputs:
    exit_code:
      description: 'Action exit code (0/1/2).'
    cache_key:
      description: 'Spec §7 cache key (generate modes).'
    cache_hit:
      description: 'true when the generated package came from the cache.'
    package:
      description: 'Generated package path (generate modes).'
    test_count:
      description: 'Number of generated tests (generate modes).'
    junit:
      description: 'Raw pytest junit.xml path (run modes).'
    report:
      description: 'report.json path (run modes).'

branding:
  icon: 'test-tube'
  color: 'purple'
