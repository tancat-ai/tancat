
version: '3.8'

# Host ports on purpose: NONE.
# 2026-09-30 (owner): host 8080 on this machine is his local llama.cpp model
# server, and 11434 is Ollama's unauthenticated API. The app and Ollama
# therefore publish no host port at all - containers reach each other over
# `playwright-network`, and the app is reached from the phone through
# `remote-pi-relay` (:3000), a separate container. If the app ever needs its own
# host port, it gets a new number and the owner's word comes first.

services:
  test-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tancat
    volumes:
      # The app writes generated tests and evidence - keep these writable.
      - ./generated_tests:/app/generated_tests
      - ./evidence:/app/evidence
      # Dev-only content that the container only reads: read-only, so a
      # compromised container cannot modify host scripts or notebooks.
      - ./scripts:/app/scripts:ro
      - ./notebooks:/app/notebooks:ro
    environment:
      # Compose is the bundled-Ollama deployment. The app's own .env is
      # host-oriented (LLM_PROVIDER=openai-local and localhost URLs by default),
      # so it must not silently redirect the container. The provider and Ollama
      # URL read Compose-specific variables that default to the bundled service;
      # set COMPOSE_LLM_PROVIDER (and the matching base URL) to choose another
      # provider inside Compose.
      - LLM_PROVIDER=${COMPOSE_LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${COMPOSE_OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-300}
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234}
      - LM_STUDIO_MODEL=${LM_STUDIO_MODEL:-lmstudio-community/Qwen2.5-7B-Instruct-GGUF}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:8080/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-llama}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OUTPUT_DIR=/app/generated_tests
    expose:
      - "8080"   # container-network only; NO host published port (see above)
    networks:
      - playwright-network
    depends_on:
      ollama:
        condition: service_healthy

  # Ollama service (default). Pinned 2026-09-30 to the version `latest` pointed
  # at (0.35.0), by multi-arch manifest digest.
  ollama:
    image: ollama/ollama:0.35.0@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - playwright-network
    expose:
      - "11434"  # container-network only; NO host published port (see above)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Optional: LM Studio (disabled by default)
  # lm-studio:
  #   # Note: LM Studio doesn't have an official Docker image; typically runs locally on host
  #   # Use host.docker.internal to connect to LM Studio running on your host machine at port 1234
  #   # Uncomment below if you want to run LM Studio in Docker (requires custom image)
  #   # image: your-custom-lm-studio-image
  #   # container_name: lm-studio
  #   # ports:
  #   #   - "1234:1234"
  #   # networks:
  #   #   - playwright-network

volumes:
  ollama-data:

networks:
  playwright-network:
    driver: bridge
