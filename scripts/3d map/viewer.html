<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TanCat — 3D Architecture Map (Cosmograph)</title>
<!-- Cosmograph is ESM-only; esm.sh serves the bundled module graph with CORS.
     v1.4.2 keeps the classic new Cosmograph({...}) / setData API. Network is
     needed at view time; no vendored assets. Serve from the repo root:
       python -m http.server 8799
       http://localhost:8799/scripts/3d%20map/viewer.html -->
<style>
  body { margin: 0; background: #0b1020; color: #dfe6f2; font-family: ui-sans-serif, system-ui, sans-serif; }
  #graph { position: fixed; inset: 0; }
  #legend {
    position: fixed; right: 14px; top: 14px; z-index: 10;
    background: rgba(10, 16, 30, 0.88); border: 1px solid #2a3350;
    border-radius: 10px; padding: 10px 14px; font-size: 12px; min-width: 150px;
  }
  #legend b { display: block; margin-bottom: 6px; letter-spacing: .03em; }
  #legend div { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  #stats {
    position: fixed; left: 14px; bottom: 14px; z-index: 10;
    background: rgba(10, 16, 30, 0.88); border: 1px solid #2a3350;
    border-radius: 10px; padding: 8px 12px; font-size: 12px;
  }
  #hint { position: fixed; left: 14px; top: 14px; z-index: 10; font-size: 12px; opacity: .7; }
</style>
</head>
<body>
  <div id="graph"></div>
  <div id="hint">drag to rotate · scroll to zoom · hover a node for its label</div>
  <div id="legend">
    <b>Architecture layers</b>
    <div><span class="swatch" style="background:#e74c3c"></span>interface</div>
    <div><span class="swatch" style="background:#e67e22"></span>orchestration</div>
    <div><span class="swatch" style="background:#f1c40f"></span>intelligence</div>
    <div><span class="swatch" style="background:#2ecc71"></span>context</div>
    <div><span class="swatch" style="background:#3498db"></span>refinement</div>
    <div><span class="swatch" style="background:#9b59b6"></span>output</div>
    <div><span class="swatch" style="background:#95a5a6"></span>utility</div>
    <div><span class="swatch" style="background:#5dade2"></span>documentation</div>
    <div><span class="swatch" style="background:#bb8fce"></span>configuration</div>
    <div><span class="swatch" style="background:#5d6d7e"></span>other</div>
  </div>
  <div id="stats">loading…</div>

  <script type="module">
    import { Cosmograph } from "https://esm.sh/@cosmograph/cosmograph@1.4.2";

    const GROUP_COLORS = {
      interface: "#e74c3c", orchestration: "#e67e22", intelligence: "#f1c40f",
      context: "#2ecc71", refinement: "#3498db", output: "#9b59b6",
      utility: "#95a5a6", Documentation: "#5dade2", Configuration: "#bb8fce",
      Other: "#5d6d7e",
    };

    (async () => {
      const statsEl = document.getElementById("stats");
      try {
        const res = await fetch("../3d_map_data.json");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const nodes = data.nodes.map(n => ({ ...n }));
        const links = data.links.map(l => ({ source: l.source, target: l.target }));

        // v1 API: constructor takes (container, config); setData takes
        // (nodes, links) as two arguments (no separate init()).
        const container = document.getElementById("graph");
        const cosmograph = new Cosmograph(container, {
          backgroundColor: "#0b1020",
          nodeColor: d => GROUP_COLORS[d.group] || "#5d6d7e",
          nodeLabel: d => d.label,
          nodeSizeScale: 0.5,
          hoveredNodeSize: 3,
          showHoveredNodeLabel: true,
          linkColor: "#2a3350",
          linkWidth: 0.4,
        });
        cosmograph.setData(nodes, links);
        statsEl.textContent = `${nodes.length.toLocaleString()} nodes · ${links.length.toLocaleString()} links · generated by scripts/3d map/generate_3d_map.py`;
      } catch (err) {
        statsEl.textContent = `Failed to load 3d_map_data.json: ${err.message}`;
      }
    })();
  </script>
</body>
</html>
